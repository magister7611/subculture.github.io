<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서브컬쳐 RP 커뮤니티</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      line-height: 1.7;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 22px;
      margin-top: 0;
      color: #93c5fd;
    }

    .button-area {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    a.button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a.button:hover {
      background: #1d4ed8;
    }

    .muted {
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>서브컬쳐 모바일 게임 RP 커뮤니티</h1>
      <p class="muted">
        블루아카이브, 원신, 붕괴 스타레일, 니케 등 다양한 서브컬쳐 모바일 게임 캐릭터를 받는 RP 커뮤니티입니다.
      </p>
    </section>

    <section class="card">
      <h2>신청 링크</h2>
      <p>아래 버튼을 통해 캐릭터 신청·변경 및 활동신청을 진행할 수 있습니다.</p>
      <div class="button-area">
        <a class="button" href="여기에_캐릭터_신청_변경_폼_주소">캐릭터 신청·변경</a>
        <a class="button" href="여기에_활동신청_폼_주소">활동신청</a>
      </div>
    </section>

    <section class="card">
      <h2>지원 장르</h2>
      <ul>
        <li>블루아카이브</li>
        <li>원신</li>
        <li>붕괴 스타레일</li>
        <li>니케</li>
        <li>기타 서브컬쳐 모바일 미소녀 게임</li>
      </ul>
    </section>

    <section class="card">
      <h2>운영 안내</h2>
      <p>
        신청은 구글 폼을 통해 진행되며, 제출된 내용은 자동으로 시트에 반영됩니다.
        캐릭터 변경 시 기존 보유 재화는 유지됩니다.
      </p>
    </section>
  </main>
</body>
</html>
